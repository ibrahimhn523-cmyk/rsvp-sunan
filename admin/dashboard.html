<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة التحكم</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/admin.css"></head><body><header><div>لوحة التحكم</div><button id="logoutBtn">تسجيل خروج</button></header><main>
<form id="settingsForm" class="card"><h3>روابط الشعارات</h3><input name="logo_url" placeholder="logo url"><input name="sponsor1_url" placeholder="sponsor1 url"><input name="sponsor2_url" placeholder="sponsor2 url"><button>حفظ الشعارات</button></form>
<form id="questionsForm" class="card"><h3>أسئلة اليوم (حتى 4)</h3><label>تاريخ اليوم</label><input type="date" name="quiz_date" required>
<div class="grid2">
<div><h4>سؤال 1</h4><input name="q1_text" placeholder="نص السؤال"><input name="q1_a" placeholder="A"><input name="q1_b" placeholder="B"><input name="q1_c" placeholder="C"><input name="q1_d" placeholder="D"><select name="q1_correct"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select></div>
<div><h4>سؤال 2</h4><input name="q2_text" placeholder="نص السؤال"><input name="q2_a" placeholder="A"><input name="q2_b" placeholder="B"><input name="q2_c" placeholder="C"><input name="q2_d" placeholder="D"><select name="q2_correct"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select></div>
<div><h4>سؤال 3</h4><input name="q3_text" placeholder="نص السؤال"><input name="q3_a" placeholder="A"><input name="q3_b" placeholder="B"><input name="q3_c" placeholder="C"><input name="q3_d" placeholder="D"><select name="q3_correct"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select></div>
<div><h4>سؤال 4</h4><input name="q4_text" placeholder="نص السؤال"><input name="q4_a" placeholder="A"><input name="q4_b" placeholder="B"><input name="q4_c" placeholder="C"><input name="q4_d" placeholder="D"><select name="q4_correct"><option value="a">A</option><option value="b">B</option><option value="c">C</option><option value="d">D</option></select></div>
</div>
<button>حفظ الأسئلة</button></form>
<p id="status" class="card"></p></main><footer>جمعية سنن</footer><script type="module" src="/js/dashboard.js"></script></body></html>
