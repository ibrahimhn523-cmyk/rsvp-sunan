<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الحضور - حفل تكريم خريجي البرامج العلمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #2A3F46;
            --brown-gray: #7D7168;
            --beige-light: #F3EFE9;
            --warm-gray: #8C847D;
            --accent-gold: #D4AF37;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, var(--beige-light) 0%, #E8E2D8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(42, 63, 70, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(125, 113, 104, 0.03) 0%, transparent 50%);
            animation: backgroundMove 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes backgroundMove {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-20px, 20px); }
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: white;
            border-radius: 24px;
            box-shadow: 
                0 20px 60px rgba(42, 63, 70, 0.12),
                0 8px 24px rgba(42, 63, 70, 0.08);
            overflow: hidden;
            position: relative;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header-decoration {
            height: 6px;
            background: linear-gradient(90deg, var(--primary-dark) 0%, var(--brown-gray) 100%);
            position: relative;
            overflow: hidden;
        }

        .header-decoration::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            to { left: 100%; }
        }

        .header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #3a5561 100%);
            padding: 50px 40px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: 0.4;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            margin-bottom: 35px;
            position: relative;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            max-width: 280px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: translateY(-5px);
        }

        .event-title {
            color: white;
            font-size: 42px;
            font-weight: 400;
            margin-bottom: 12px;
            font-family: 'Lalezar', cursive;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            position: relative;
            animation: fadeIn 1s ease-out 0.5s both;
            letter-spacing: 1px;
        }

        .event-subtitle {
            color: var(--beige-light);
            font-size: 20px;
            font-weight: 400;
            opacity: 0.95;
            position: relative;
            animation: fadeIn 1s ease-out 0.7s both;
            font-family: 'Lalezar', cursive;
        }

        .content {
            padding: 45px 40px;
        }

        .form-section {
            animation: fadeIn 1s ease-out 0.9s both;
        }

        .form-title {
            font-size: 32px;
            color: var(--primary-dark);
            font-weight: 400;
            margin-bottom: 35px;
            text-align: center;
            font-family: 'Lalezar', cursive;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 20px;
            font-weight: 400;
            color: var(--primary-dark);
            margin-bottom: 10px;
            font-family: 'Lalezar', cursive;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #E0DCD5;
            border-radius: 12px;
            font-size: 18px;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-dark);
            box-shadow: 0 0 0 4px rgba(42, 63, 70, 0.08);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, #3a5561 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 24px;
            font-weight: 400;
            font-family: 'Lalezar', cursive;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            box-shadow: 0 8px 20px rgba(42, 63, 70, 0.25);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .submit-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(42, 63, 70, 0.35);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            padding: 30px 40px;
            background: linear-gradient(135deg, var(--beige-light) 0%, #EBE5DB 100%);
            color: var(--brown-gray);
            font-size: 18px;
            font-family: 'Lalezar', cursive;
        }

        .footer p {
            margin-bottom: 8px;
        }

        .success-message {
            display: none;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            font-weight: 400;
            font-size: 20px;
            font-family: 'Lalezar', cursive;
            animation: fadeIn 0.5s ease-out;
        }

        .success-message.show {
            display: block;
        }

        .error-message {
            display: none;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            font-weight: 400;
            font-size: 20px;
            font-family: 'Lalezar', cursive;
            animation: fadeIn 0.5s ease-out;
        }

        .error-message.show {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                border-radius: 16px;
            }

            .header {
                padding: 40px 25px 30px;
            }

            .logo {
                max-width: 220px;
            }

            .event-title {
                font-size: 32px;
            }

            .event-subtitle {
                font-size: 18px;
            }

            .content {
                padding: 35px 25px;
            }

            .form-title {
                font-size: 28px;
            }

            .form-group label {
                font-size: 18px;
            }

            .form-group input {
                font-size: 16px;
            }

            .submit-btn {
                font-size: 20px;
            }

            .footer {
                padding: 25px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-decoration"></div>
        
        <div class="header">
            <div class="logo-container">
                <img src="data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");" alt="شعار جمعية سنن" class="logo">
            </div>
            
            <h1 class="event-title">حفل تكريم خريجي البرامج العلمية</h1>
            <p class="event-subtitle">حضورك ومن تحب، يزيد حفلنا بهاء</p>
        </div>

        <div class="content">
            <div class="form-section">
                <h2 class="form-title">تأكيد الحضور</h2>
                
                <form id="rsvpForm">
                    <div class="form-group">
                        <label for="fullName">الاسم</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="أدخل الاسم">
                    </div>

                    <div class="form-group">
                        <label for="phone">رقم الجوال</label>
                        <input type="tel" id="phone" name="phone" required placeholder="05xxxxxxxx" pattern="[0-9]{10}">
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span>تأكيد الحضور</span>
                    </button>

                    <div class="success-message" id="successMessage">
                        تم رصد التسجيل بنجاح! شكرا لك
                    </div>

                    <div class="error-message" id="errorMessage">
                        عذرا، حدث خطأ. الرجاء المحاولة مرة أخرى
                    </div>
                </form>
            </div>
        </div>

        <div class="footer">
            <p>جمعية سنن التعليمية</p>
            <p>نسعد بحضوركم ومشاركتكم معنا</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwx9fNcL0PQwfqhbVPHz__3qU5I6vwAqxFVlcGZ61_rRB7vX0FzBdQ75cV57eL_k7vJjQ/exec';

        document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            successMessage.classList.remove('show');
            errorMessage.classList.remove('show');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>جاري الإرسال...</span>';
            
            const formData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                timestamp: new Date().toLocaleString('ar-SA', { timeZone: 'Asia/Riyadh' })
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                successMessage.classList.add('show');
                this.reset();
                
            } catch (error) {
                console.error('خطأ في الإرسال:', error);
                errorMessage.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>تأكيد الحضور</span>';
            }
        });

        document.getElementById('phone').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
            if (this.value.length > 10) {
                this.value = this.value.slice(0, 10);
            }
        });

        document.getElementById('phone').addEventListener('blur', function(e) {
            const phone = this.value;
            if (phone && phone.length === 10 && !phone.startsWith('05')) {
                alert('الرجاء إدخال رقم جوال سعودي صحيح يبدأ بـ 05');
                this.focus();
            }
        });
    </script>
</body>
</html>
